<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>退休菜馆</title>
<style>
  :root{
    --cream:#fff7e6; --panel:#fffdf5; --ink:#5a3e2b; --ink2:#8a6f57;
    --line:#e7cfa3; --line2:#d4a373;
    --green:#5fb96b; --green-d:#3e9e54;
    --yellow:#ffd25a; --orange:#ff9f43; --red:#ff6b81; --blue:#5ab0e0; --pink:#ff8fab;
    --shadow:0 4px 0 rgba(0,0,0,.12), 0 8px 18px rgba(120,80,40,.18);
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; position:fixed;
    overscroll-behavior:none; touch-action:manipulation;
    font-family:"PingFang SC","Segoe UI Rounded","SF Pro Rounded","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); user-select:none; -webkit-user-select:none;
    background:linear-gradient(180deg,#aee7f0 0%,#cdeFd4 55%,#bfe7b0 100%);}
  #game{position:relative; width:100%; height:100%; display:flex; flex-direction:column;
    padding-top:var(--safeT); padding-bottom:var(--safeB);}

  #hud{display:flex; gap:6px; align-items:center; padding:6px 8px; flex-wrap:wrap; z-index:5;}
  .chip{background:var(--panel); border:3px solid var(--line2); border-radius:14px;
    padding:5px 10px; font-weight:800; display:flex; align-items:center; gap:5px;
    box-shadow:0 3px 0 rgba(0,0,0,.10); font-size:14px; white-space:nowrap;}
  .chip .ic{font-size:16px;}
  .chip.gold{color:#b8860b;} .chip.fame{color:#e0568b;}
  #energyWrap{flex:1; min-width:90px; max-width:240px; background:var(--panel);
    border:3px solid var(--line2); border-radius:14px; padding:3px 8px 4px; box-shadow:0 3px 0 rgba(0,0,0,.10);}
  #energyBar{height:12px; border-radius:8px; background:#f0e0c0; overflow:hidden;}
  #energyFill{height:100%; width:100%; border-radius:8px; background:linear-gradient(90deg,#ffd25a,#ff9f43); transition:width .3s;}
  #energyWrap .lbl{font-size:10px; font-weight:800; color:var(--ink2);}

  #stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0;}
  canvas{border-radius:22px; box-shadow:var(--shadow); touch-action:none;}
  #ticker{position:absolute; top:6px; left:50%; transform:translateX(-50%);
    background:rgba(255,253,245,.94); border:3px solid var(--pink); border-radius:18px;
    padding:5px 14px; font-weight:800; font-size:13px; color:#c0397a; box-shadow:0 3px 0 rgba(0,0,0,.1);
    max-width:92%; text-align:center;}

  #toolbar{display:flex; gap:7px; justify-content:center; padding:6px; flex-wrap:wrap; z-index:5;}
  .tool{width:58px; height:58px; border-radius:16px; background:var(--panel);
    border:3px solid var(--line2); box-shadow:0 4px 0 rgba(0,0,0,.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    font-size:22px; transition:transform .08s, box-shadow .08s; gap:1px;}
  .tool .nm{font-size:10px; font-weight:800; color:var(--ink2);}
  .tool:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .tool.sel{border-color:var(--green-d); background:#eafbe7; transform:translateY(-2px); box-shadow:0 6px 0 var(--green-d);}
  .menu{display:flex; gap:7px; justify-content:center; padding:0 6px 8px; flex-wrap:wrap; z-index:5;}
  .mbtn{position:relative; padding:9px 13px; border-radius:15px; background:var(--panel); border:3px solid var(--line2);
    box-shadow:0 4px 0 rgba(0,0,0,.12); font-weight:800; font-size:14px; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; gap:5px; transition:transform .08s;}
  .mbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .mbtn.sleep{background:linear-gradient(180deg,#7ec8e3,#5ab0e0); color:#fff; border-color:#3d97cc; box-shadow:0 4px 0 #3d97cc;}
  .mbtn .badge{position:absolute; top:-8px; right:-6px; background:var(--red); color:#fff; font-size:11px;
    min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    border:2px solid #fff; padding:0 4px; box-shadow:0 2px 4px rgba(0,0,0,.2);}

  #overlay{position:fixed; inset:0; background:rgba(60,40,20,.45); display:none;
    align-items:center; justify-content:center; z-index:20; padding:14px;
    padding-top:calc(14px + var(--safeT)); padding-bottom:calc(14px + var(--safeB));}
  #overlay.on{display:flex;}
  .panel{background:var(--cream); border:5px solid var(--line2); border-radius:24px;
    width:min(540px,96%); max-height:90%; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 10px 0 rgba(0,0,0,.15), 0 20px 40px rgba(80,50,20,.35);}
  .ptitle{padding:13px 16px; font-size:19px; font-weight:900; display:flex; justify-content:space-between;
    align-items:center; background:linear-gradient(180deg,#ffe8a8,#ffd25a); color:#7a5418; border-bottom:4px solid var(--line2);}
  .pclose{width:34px; height:34px; border-radius:11px; background:#fff; border:3px solid var(--line2);
    font-weight:900; cursor:pointer; line-height:1; box-shadow:0 3px 0 rgba(0,0,0,.12); color:var(--ink); font-size:16px;}
  .pbody{padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .row{display:flex; align-items:center; gap:10px; background:var(--panel); border:3px solid var(--line);
    border-radius:15px; padding:10px 11px; margin-bottom:8px;}
  .row .icon{width:46px; height:46px; flex:none; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:26px; background:#f6ecd6; border:2px solid var(--line);}
  .row .info{flex:1; min-width:0;}
  .row .nm{font-weight:800; font-size:15px;}
  .row .sub{font-size:12px; color:var(--ink2); margin-top:2px; line-height:1.4;}
  .row .act{display:flex; flex-direction:column; gap:5px; align-items:flex-end;}
  .actrow{display:flex; gap:5px;}
  .pill{padding:9px 13px; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer;
    border:3px solid var(--green-d); background:var(--green); color:#fff; box-shadow:0 3px 0 var(--green-d); white-space:nowrap;}
  .pill:active{transform:translateY(2px); box-shadow:0 1px 0 var(--green-d);}
  .pill.sm{padding:7px 10px; font-size:13px;}
  .pill.buy{border-color:#d4900a; background:var(--yellow); color:#7a5418; box-shadow:0 3px 0 #d4900a;}
  .pill.gray{border-color:#bbb; background:#e2e2e2; color:#999; box-shadow:0 3px 0 #bbb; cursor:default;}
  .pill.red{border-color:#d6435a; background:var(--red); color:#fff; box-shadow:0 3px 0 #d6435a;}
  .vip{display:inline-block; font-size:10px; font-weight:900; padding:1px 6px; border-radius:7px;
    background:linear-gradient(90deg,#ffd25a,#ff9f43); color:#7a3a00; margin-left:5px; vertical-align:middle;}
  .tag{display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:8px;
    background:#f0e0c0; color:#8a6f57; margin-left:4px;}
  .tag.lock{background:#eadfce; color:#a08a6a;}
  .hint{font-size:12px; color:var(--ink2); text-align:center; margin:2px 0 12px; line-height:1.5;}
  .empty{text-align:center; color:var(--ink2); padding:30px 10px; font-size:14px; line-height:1.7;}
  .tabs{display:flex; gap:6px; margin-bottom:10px;}
  .tab{flex:1; text-align:center; padding:9px; border-radius:12px; font-weight:800; font-size:13px;
    background:#f0e0c0; color:#8a6f57; cursor:pointer; border:3px solid var(--line);}
  .tab.on{background:var(--green); color:#fff; border-color:var(--green-d);}
  .sectit{font-weight:900; margin:6px 2px 8px; color:#7a5418; font-size:14px;}

  #toast{position:fixed; left:50%; bottom:calc(150px + var(--safeB)); transform:translateX(-50%) translateY(20px);
    background:rgba(50,35,20,.92); color:#fff; padding:10px 18px; border-radius:15px; font-weight:700;
    font-size:14px; opacity:0; transition:.3s; z-index:30; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.3); max-width:80%; text-align:center;}
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

  #fade{position:fixed; inset:0; background:#1a2a3a; color:#fff; display:none; z-index:40;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; font-size:20px; font-weight:800;}
  #fade.on{display:flex; animation:fadeIn .5s;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .moon{font-size:56px; animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  #summary{background:var(--cream); border:4px solid var(--line2); border-radius:18px; padding:16px 22px;
    color:var(--ink); font-size:15px; line-height:1.9; min-width:210px; text-align:center;}

  /* 开场 / 起名 */
  .fullscreen{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:24px; text-align:center;
    background:linear-gradient(180deg,#aee7f0,#cdeFd4 60%,#bfe7b0);}
  #setup{display:none;}
  #setup.fullscreen{justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(22px + var(--safeT)) 18px calc(22px + var(--safeB));}
  .fullscreen h1{font-size:36px; margin:0; color:#3e7d4a; text-shadow:3px 3px 0 #fff, 0 6px 0 rgba(0,0,0,.1);}
  .fullscreen p{max-width:430px; font-size:14.5px; line-height:1.75; color:var(--ink); background:rgba(255,253,245,.85);
    padding:16px 20px; border-radius:18px; border:3px solid var(--line2);}
  .bigbtn{padding:15px 38px; font-size:19px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#6fce7b,#4caf5d); border:4px solid #3e9e54; border-radius:22px;
    box-shadow:0 6px 0 #3e9e54; transition:transform .1s;}
  .bigbtn:active{transform:translateY(4px); box-shadow:0 2px 0 #3e9e54;}
  .seedlogo{font-size:70px; animation:bob 2.5s ease-in-out infinite;}
  #resetBtn{margin-top:2px; font-size:12px; color:#6b7d8a; background:none; border:none; cursor:pointer; text-decoration:underline;}
  #nameInput{font-size:18px; font-weight:800; text-align:center; padding:12px 16px; border-radius:16px;
    border:3px solid var(--line2); background:#fff; color:var(--ink); width:220px; outline:none;}
  .charGrid{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; max-width:344px;}
  .charBtn{width:76px; border-radius:14px; background:#fff; border:3px solid var(--line2);
    cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.12); display:flex; flex-direction:column; align-items:center;
    padding:6px 4px 5px; gap:2px; transition:transform .08s;}
  .charBtn canvas{display:block;}
  .charBtn .cn{font-size:11px; font-weight:800; color:var(--ink2);}
  .charBtn.on{border-color:var(--green-d); background:#eafbe7; transform:translateY(-3px); box-shadow:0 7px 0 var(--green-d);}
  .setupCard{background:rgba(255,253,245,.9); border:3px solid var(--line2); border-radius:20px; padding:18px 20px;
    display:flex; flex-direction:column; gap:14px; align-items:center;}
  .setupLbl{font-weight:800; color:#7a5418; font-size:15px;}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="chip" id="dateChip"><span class="ic">🌸</span><span id="dateTxt">春 · 第1天</span></div>
    <div class="chip gold"><span class="ic">🪙</span><span id="goldTxt">0</span></div>
    <div class="chip fame"><span class="ic">⭐</span><span id="fameTxt">0</span></div>
    <div id="energyWrap"><div class="lbl">体力</div><div id="energyBar"><div id="energyFill"></div></div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ticker">菜馆开张啦～</div>
  </div>
  <div id="toolbar"></div>
  <div class="menu">
    <div class="mbtn" id="btnShop">🛒 商店</div>
    <div class="mbtn" id="btnDiner">🍳 菜馆<span class="badge" id="dinerBadge" style="display:none">0</span></div>
    <div class="mbtn" id="btnBook">📖 图鉴</div>
    <div class="mbtn" id="btnBag">🎒 背包</div>
    <div class="mbtn sleep" id="btnSleep">🛏️ 打烊</div>
  </div>
  <div id="toast"></div>
  <div id="fade"><div class="moon">🌙</div><div id="summary"></div></div>
</div>

<div id="overlay"><div class="panel" id="panel"></div></div>

<!-- 开场 -->
<div id="intro" class="fullscreen">
  <div class="seedlogo">🍳</div>
  <h1>退休菜馆</h1>
  <p>在城里卷不动了？欢迎提前退休。🌿<br>
  这儿没有 KPI，没有早会，只有种不完的菜和一群嘴馋的小动物。<br>
  种点菜、做几道拿手好菜招待客人，看着存款慢慢变多——<br>
  别急着当大富婆，退休的意义不是无所事事，<br>是终于能为自己，好好忙活一回。☕</p>
  <button class="bigbtn" id="startBtn">开始退休生活</button>
  <button id="resetBtn">（重新开档）</button>
</div>

<!-- 起名 + 选人物 -->
<div id="setup" class="fullscreen">
  <h1 style="font-size:28px">先安顿一下</h1>
  <div class="setupCard">
    <div class="setupLbl">给自己起个名字 🪪</div>
    <input id="nameInput" maxlength="6" placeholder="比如：露西" autocomplete="off">
    <div class="setupLbl">选个搬进菜馆的人物 🏡</div>
    <div class="charGrid" id="charGrid"></div>
  </div>
  <button class="bigbtn" id="setupOk">就这么定，开张！</button>
</div>

// ---------- 客人 ----------
function customersPerDay(){return clamp(2+Math.floor(S.fame/350),2,6);}
function vipChance(){return clamp(0.08+S.fame/8000,0.08,0.32);}
function unlockedDishes(){return Object.keys(DISHES).filter(id=>S.fame>=DISHES[id].fame);}
function dishAchievable(id){
  const r=DISHES[id].recipe;
  for(const k in r){if(CROPS[k]){const c=CROPS[k];const inSeason=(c.season===-1||c.season===S.season);if(!inSeason&&!(S.inv[k]>0))return false;}}
  return true;
}
function canCook(id){const r=DISHES[id].recipe;for(const k in r){if((S.inv[k]||0)<r[k])return false;}return true;}
function genCustomers(){
  const n=customersPerDay();
  const unlocked=unlockedDishes();
  const cookable=unlocked.filter(canCook);
  const achievable=unlocked.filter(dishAchievable);
  const list=[];
  for(let i=0;i<n;i++){
    let pool;
    if(i===0&&cookable.length)pool=cookable;          // 当天保证第一位客人做得出
    else pool=achievable.length?achievable:unlocked;
    const dish=pick(pool);
    const vip=Math.random()<vipChance();
    const base=DISHES[dish].price;
    const tip=Math.round(base*rnd(0.12,0.35));
    list.push({avatar:pick(AVATARS),name:pick(NAMES),dish,vip,tip,pay:(vip?base*2:base)+tip});
  }
  return list;
}

let TERR=[], WALK=[];
function tkey(x,y){return y*WORLD_W+x;}
function inField(x,y){return x>=FARM_X&&x<FARM_X+GRID_W&&y>=FARM_Y&&y<FARM_Y+GRID_H;}
function tileToPlot(x,y){return inField(x,y)?((y-FARM_Y)*GRID_W+(x-FARM_X)):-1;}
function buildWorld(){
  TERR=new Array(WORLD_W*WORLD_H).fill("grass");
  WALK=new Array(WORLD_W*WORLD_H).fill(true);
  for(let x=1;x<=11;x++)TERR[tkey(x,4)]="path";       // 横向小路
  for(let y=2;y<=4;y++)TERR[tkey(6,y)]="path";        // 竖向小路
  for(const[x,y]of POND){TERR[tkey(x,y)]="water";WALK[tkey(x,y)]=false;}
  for(let dx=0;dx<DINER.w;dx++)for(let dy=0;dy<DINER.h;dy++)WALK[tkey(DINER.x+dx,DINER.y+dy)]=false;
  for(let dx=0;dx<SHOP.w;dx++)for(let dy=0;dy<SHOP.h;dy++)WALK[tkey(SHOP.x+dx,SHOP.y+dy)]=false;
  TERR[tkey(DINER.doorX,DINER.doorY)]="path"; WALK[tkey(DINER.doorX,DINER.doorY)]=true;
  TERR[tkey(SHOP.doorX,SHOP.doorY)]="path"; WALK[tkey(SHOP.doorX,SHOP.doorY)]=true;
  for(const[x,y]of TREES)WALK[tkey(x,y)]=false;
}
function isWalkable(x,y){if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return false;return WALK[tkey(x,y)];}
function findPath(sx,sy,tx,ty){                      // BFS 四向寻路
  if(!isWalkable(tx,ty))return null;
  const prev={}; prev[tkey(sx,sy)]=-1; const q=[[sx,sy]]; let head=0;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(head<q.length){
    const c=q[head++]; if(c[0]===tx&&c[1]===ty)break;
    for(const d of dirs){const nx=c[0]+d[0],ny=c[1]+d[1];if(isWalkable(nx,ny)&&!(tkey(nx,ny)in prev)){prev[tkey(nx,ny)]=tkey(c[0],c[1]);q.push([nx,ny]);}}
  }
  if(!(tkey(tx,ty)in prev))return null;
  const path=[]; let k=tkey(tx,ty);
  while(k!==-1){path.push([k%WORLD_W,Math.floor(k/WORLD_W)]);k=prev[k];}
  return path.reverse();
}
function nearestWalkable(tx,ty,fromx,fromy){          // 找目标附近可站的格子
  if(isWalkable(tx,ty))return[tx,ty];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]]; let best=null,bd=1e9;
  for(const d of dirs){const nx=tx+d[0],ny=ty+d[1];if(isWalkable(nx,ny)){const dd=Math.abs(nx-fromx)+Math.abs(ny-fromy);if(dd<bd){bd=dd;best=[nx,ny];}}}
  return best;
}
let cam={x:0,y:0};

}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){

function drawGround(x,y,now){
  const X=sx2(x),Y=sy2(y),s=TILE,t=TERR[tkey(x,y)],hh=hsh(x,y);

  }

  }
}

function drawCustomer(x,y,cu,now){
  const cx=sx2(x)+TILE/2, by=sy2(y)+TILE*0.85, bob=Math.sin(now*2+x)*TILE*0.03;
  ctx.fillStyle="rgba(0,0,0,.15)";ctx.beginPath();ctx.ellipse(cx,by,TILE*0.2,TILE*0.06,0,0,Math.PI*2);ctx.fill();
  fillRR(cx-TILE*0.16,by-TILE*0.4-bob,TILE*0.32,TILE*0.4,TILE*0.14,cu.vip?"#ffd25a":"#cfe6ff");
  ctx.font=`${Math.round(TILE*0.4)}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(cu.avatar,cx,by-TILE*0.5-bob);
  const dish=DISHES[cu.dish];
  fillRR(cx+TILE*0.1,by-TILE*1.02-bob,TILE*0.52,TILE*0.44,TILE*0.1,"#fffdf5");
  ctx.fillStyle="#fffdf5";ctx.beginPath();ctx.moveTo(cx+TILE*0.2,by-TILE*0.62-bob);ctx.lineTo(cx+TILE*0.32,by-TILE*0.6-bob);ctx.lineTo(cx+TILE*0.22,by-TILE*0.5-bob);ctx.closePath();ctx.fill();
  ctx.font=`${Math.round(TILE*0.28)}px serif`;ctx.fillText(dish.emoji,cx+TILE*0.36,by-TILE*0.8-bob);
}
function drawCrop(x,y,s,p,now){
  const c=CROPS[p.crop],cx=x+s/2,by=y+s*0.86;
  const ratio=p.ready?1:clamp(p.growth/c.grow,0,1);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  if(p.ready){
    const wob=Math.sin(now*3+x)*2;
    ctx.strokeStyle="#3e9e54"; ctx.lineWidth=Math.max(2,s*0.05);
    ctx.beginPath(); ctx.moveTo(cx,by); ctx.lineTo(cx,by-s*0.4); ctx.stroke();
    ctx.fillStyle="#4caf5d"; leaf(cx,by-s*0.3,s*0.18,-0.6); leaf(cx,by-s*0.36,s*0.18,0.6);
    ctx.font=`${s*0.5}px serif`; ctx.fillText(c.emoji,cx+wob,by-s*0.5);
    const tw=(Math.sin(now*4)+1)/2; ctx.globalAlpha=0.5+tw*0.5; ctx.font=`${s*0.22}px serif`;
    ctx.fillText("✨",cx+s*0.22,by-s*0.7); ctx.globalAlpha=1;
  } else if(ratio<0.34){
    ctx.font=`${s*0.3}px serif`; ctx.fillText("🌱",cx,by-s*0.18);
  } else {
    const h=s*(0.2+0.42*ratio); ctx.strokeStyle="#3e9e54"; ctx.lineWidth=Math.max(2,s*0.05);
    ctx.beginPath(); ctx.moveTo(cx,by); ctx.lineTo(cx,by-h); ctx.stroke();
    ctx.fillStyle="#4caf5d"; leaf(cx,by-h*0.6,s*0.16*ratio+s*0.06,-0.6); leaf(cx,by-h*0.85,s*0.16*ratio+s*0.06,0.6);
  }
  // —— 作物状态提示 ——
  ctx.textAlign="center"; ctx.textBaseline="middle";
  if(p.ready){
    const jb=Math.abs(Math.sin(now*4+x))*s*0.1;            // 跳动的可收获篮子
    ctx.font=`${s*0.34}px serif`; ctx.fillText("🧺",cx,y+s*0.04-jb);
  }else{
    const pw=s*0.4,ph=s*0.085,byy=y+s*0.05,bx=cx-pw/2;     // 成长进度条
    ctx.fillStyle="rgba(255,255,255,.85)"; rr(bx,byy,pw,ph,ph/2); ctx.fill();
    ctx.fillStyle="#5fb96b"; rr(bx,byy,Math.max(ph,pw*clamp(p.growth/c.grow,0,1)),ph,ph/2); ctx.fill();
    if(!p.watered){                                         // 需要浇水：跳动水滴
      const wb=Math.sin(now*3+x)*s*0.05; ctx.font=`${s*0.3}px serif`;
      ctx.fillText("💧",cx+pw*0.5+s*0.15,byy+ph*0.5+wb);
    }
  }
  function leaf(lx,ly,rr2,dir){ctx.save();ctx.translate(lx,ly);ctx.rotate(dir);ctx.beginPath();ctx.ellipse(rr2*0.7,0,rr2,rr2*0.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
}
function drawPlayer(){

// ---------- Q 版角色绘制（通用，DC 为当前上下文）----------
function fillRR(x,y,w,h,r,c){DC.fillStyle=c;const rad=Math.min(r,w/2,h/2);DC.beginPath();DC.moveTo(x+rad,y);DC.arcTo(x+w,y,x+w,y+h,rad);DC.arcTo(x+w,y+h,x,y+h,rad);DC.arcTo(x,y+h,x,y,rad);DC.arcTo(x,y,x+w,y,rad);DC.closePath();DC.fill();}
function fillEl(cx,cy,rx,ry,c){DC.fillStyle=c;DC.beginPath();DC.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);DC.fill();}
function triUp(x,baseY,hw,h,c){DC.fillStyle=c;DC.beginPath();DC.moveTo(x-hw,baseY);DC.lineTo(x,baseY-h);DC.lineTo(x+hw,baseY);DC.closePath();DC.fill();}
function drawChar(cx,feetY,H,def,walkT,moving){
  const bodyW=H*0.42, headR=H*0.27, r=headR;
  const step=moving?Math.sin(walkT):0;
  const tnow=(Date.now()-t0)/1000;
  const bob=moving?Math.abs(Math.sin(walkT))*H*0.03:Math.sin(tnow*1.6)*H*0.012;
  const Y=feetY-bob;
  // 影子（按真实落脚点）
  DC.fillStyle="rgba(0,0,0,.15)"; DC.beginPath(); DC.ellipse(cx,feetY,bodyW*0.52,H*0.045,0,0,Math.PI*2); DC.fill();
  // 腿/脚
  const legW=H*0.12, legH=H*0.15;
  fillRR(cx-bodyW*0.22-legW/2, Y-legH+step*H*0.04, legW, legH, legW/2, def.leg||"#6b4a2e");
  fillRR(cx+bodyW*0.22-legW/2, Y-legH-step*H*0.04, legW, legH, legW/2, def.leg||"#6b4a2e");
  const bodyBot=Y-legH*0.75, bodyTop=Y-H*0.52, bodyH=bodyBot-bodyTop;
  // 手臂（先画，藏在身后）
  const armW=H*0.11, armH=H*0.21;
  fillRR(cx-bodyW/2-armW*0.35, bodyTop+H*0.06-step*H*0.03, armW, armH, armW/2, def.bodyD);
  fillRR(cx+bodyW/2-armW*0.65, bodyTop+H*0.06+step*H*0.03, armW, armH, armW/2, def.bodyD);
  // 身体
  fillRR(cx-bodyW/2, bodyTop, bodyW, bodyH, H*0.15, def.body);
  // 身体下部阴影
  DC.save(); const rad=Math.min(H*0.15,bodyW/2,bodyH/2);
  DC.beginPath();DC.moveTo(cx-bodyW/2+rad,bodyTop);DC.arcTo(cx+bodyW/2,bodyTop,cx+bodyW/2,bodyBot,rad);DC.arcTo(cx+bodyW/2,bodyBot,cx-bodyW/2,bodyBot,rad);DC.arcTo(cx-bodyW/2,bodyBot,cx-bodyW/2,bodyTop,rad);DC.arcTo(cx-bodyW/2,bodyTop,cx+bodyW/2,bodyTop,rad);DC.closePath();DC.clip();
  DC.fillStyle=def.bodyD; DC.fillRect(cx-bodyW/2,bodyBot-bodyH*0.35,bodyW,bodyH*0.35);
  DC.restore();
  if(def.belly)fillEl(cx,(bodyTop+bodyBot)/2+H*0.02,bodyW*0.26,bodyH*0.36,def.belly);
  const headCY=bodyTop-headR*0.55;
  charBehind(cx,headCY,r,def);
  fillEl(cx,headCY,headR,headR*0.96,def.skin); // 头
  charFront(cx,headCY,r,def);
  charFace(cx,headCY,r,def);
}
function charBehind(cx,cy,r,def){
  if(def.type==="human"){
    if(def.hairStyle==="long")fillEl(cx,cy+r*0.45,r*1.08,r*1.05,def.hair);
    if(def.hairStyle==="twin"){fillEl(cx-r*0.95,cy+r*0.25,r*0.42,r*0.62,def.hair);fillEl(cx+r*0.95,cy+r*0.25,r*0.42,r*0.62,def.hair);}
  }else if(def.ears==="bunny"){
    fillEl(cx-r*0.45,cy-r*1.25,r*0.25,r*0.72,def.skin);fillEl(cx+r*0.45,cy-r*1.25,r*0.25,r*0.72,def.skin);
    fillEl(cx-r*0.45,cy-r*1.25,r*0.12,r*0.46,def.accent);fillEl(cx+r*0.45,cy-r*1.25,r*0.12,r*0.46,def.accent);
  }
}
function charFront(cx,cy,r,def){
  if(def.type==="human"){
    fillEl(cx,cy-r*0.45,r*1.0,r*0.62,def.hair);            // 头顶发
    if(def.hairStyle==="bob"){fillEl(cx-r*0.86,cy-r*0.05,r*0.3,r*0.6,def.hair);fillEl(cx+r*0.86,cy-r*0.05,r*0.3,r*0.6,def.hair);}
    fillEl(cx,cy-r*0.32,r*0.92,r*0.34,def.skin);           // 露出额头/脸
  }else{
    if(def.ears==="cat"){triUp(cx-r*0.55,cy-r*0.35,r*0.32,r*0.55,def.skin);triUp(cx+r*0.55,cy-r*0.35,r*0.32,r*0.55,def.skin);triUp(cx-r*0.55,cy-r*0.4,r*0.16,r*0.32,def.accent);triUp(cx+r*0.55,cy-r*0.4,r*0.16,r*0.32,def.accent);}
    if(def.ears==="fox"){triUp(cx-r*0.6,cy-r*0.3,r*0.36,r*0.66,def.skin);triUp(cx+r*0.6,cy-r*0.3,r*0.36,r*0.66,def.skin);triUp(cx-r*0.6,cy-r*0.36,r*0.18,r*0.4,def.accent);triUp(cx+r*0.6,cy-r*0.36,r*0.18,r*0.4,def.accent);}
    if(def.ears==="bear"){fillEl(cx-r*0.68,cy-r*0.72,r*0.32,r*0.32,def.skin);fillEl(cx+r*0.68,cy-r*0.72,r*0.32,r*0.32,def.skin);fillEl(cx-r*0.68,cy-r*0.72,r*0.16,r*0.16,def.accent);fillEl(cx+r*0.68,cy-r*0.72,r*0.16,r*0.16,def.accent);}
    if(def.ears==="dog"){fillEl(cx-r*0.86,cy-r*0.05,r*0.26,r*0.5,def.accent);fillEl(cx+r*0.86,cy-r*0.05,r*0.26,r*0.5,def.accent);}
  }
}
function charFace(cx,cy,r,def){
  // 企鹅白脸 / 青蛙凸眼在头顶
  if(def.ears==="penguin")fillEl(cx,cy+r*0.12,r*0.62,r*0.78,"#fdfdfd");
  let ex=r*0.34, ey=cy+r*0.04;
  if(def.ears==="frog"){
    fillEl(cx-r*0.5,cy-r*0.78,r*0.34,r*0.34,def.skin);fillEl(cx+r*0.5,cy-r*0.78,r*0.34,r*0.34,def.skin);
    fillEl(cx-r*0.5,cy-r*0.8,r*0.16,r*0.16,"#fff");fillEl(cx+r*0.5,cy-r*0.8,r*0.16,r*0.16,"#fff");
    fillEl(cx-r*0.5,cy-r*0.76,r*0.08,r*0.09,"#2a2a2a");fillEl(cx+r*0.5,cy-r*0.76,r*0.08,r*0.09,"#2a2a2a");
  }else{
    fillEl(cx-ex,ey,r*0.11,r*0.14,"#3a2a22");fillEl(cx+ex,ey,r*0.11,r*0.14,"#3a2a22");
    fillEl(cx-ex+r*0.04,ey-r*0.04,r*0.04,r*0.04,"#fff");fillEl(cx+ex+r*0.04,ey-r*0.04,r*0.04,r*0.04,"#fff");
  }
  // 腮红
  DC.fillStyle="rgba(255,140,165,.5)";
  DC.beginPath();DC.ellipse(cx-r*0.56,cy+r*0.32,r*0.16,r*0.1,0,0,Math.PI*2);DC.fill();
  DC.beginPath();DC.ellipse(cx+r*0.56,cy+r*0.32,r*0.16,r*0.1,0,0,Math.PI*2);DC.fill();
  // 鼻/嘴
  if(def.type==="animal"&&def.ears!=="penguin"&&def.ears!=="frog")fillEl(cx,cy+r*0.24,r*0.09,r*0.07,"#5b4636");
  if(def.ears==="penguin"){DC.fillStyle=def.accent;DC.beginPath();DC.moveTo(cx-r*0.16,cy+r*0.16);DC.lineTo(cx+r*0.16,cy+r*0.16);DC.lineTo(cx,cy+r*0.4);DC.closePath();DC.fill();}
  DC.strokeStyle="rgba(90,60,40,.55)";DC.lineWidth=Math.max(1,r*0.05);DC.beginPath();DC.arc(cx,cy+r*0.30,r*0.18,Math.PI*0.18,Math.PI*0.82);DC.stroke();
}

// ---------- 人物移动（BFS 寻路、沿路径行走，绕开建筑/树/池塘）----------
function stepPlayer(){
  if(!player.path||!player.path.length){if(player.moving){player.moving=false;const cb=player.pending;player.pending=null;if(cb)cb();}return;}
  player.moving=true; player.walkT+=0.3;
  const wp=player.path[0], dx=wp[0]-player.col, dy=wp[1]-player.row, dist=Math.hypot(dx,dy), sp=0.13;
  if(dist<=sp){player.col=wp[0];player.row=wp[1];player.path.shift();
    if(!player.path.length){player.moving=false;const cb=player.pending;player.pending=null;if(cb)cb();}}
  else{player.col+=dx/dist*sp;player.row+=dy/dist*sp;}
}
function goTo(tx,ty,cb){
  const sx=Math.round(player.col), sy=Math.round(player.row);
  const path=findPath(sx,sy,tx,ty);
  if(!path){player.path=[];player.pending=null;if(cb)cb();return;}
  player.path=path.slice(1); player.pending=cb||null; player.moving=player.path.length>0;
  if(!player.path.length&&cb)cb();
}

// ---------- 触控/点击 ----------
function screenToWorldTile(clientX,clientY){
  const rect=cv.getBoundingClientRect();
  const px=(clientX-rect.left)*(VW/rect.width)+cam.x, py=(clientY-rect.top)*(VH/rect.height)+cam.y;
  return {x:Math.floor(px/TILE), y:Math.floor(py/TILE)};
}
function inBuilding(b,x,y){return x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h;}
cv.addEventListener("mousemove",e=>{const t=screenToWorldTile(e.clientX,e.clientY);hover.x=t.x;hover.y=t.y;});
cv.addEventListener("mouseleave",()=>{hover.x=-1;hover.y=-1;});
cv.addEventListener("click",e=>{const t=screenToWorldTile(e.clientX,e.clientY);handleTap(t.x,t.y);});
cv.addEventListener("touchstart",e=>{e.preventDefault();const tc=e.touches[0];const t=screenToWorldTile(tc.clientX,tc.clientY);hover.x=t.x;hover.y=t.y;handleTap(t.x,t.y);},{passive:false});
cv.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

function handleTap(x,y){
  if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return;
  const idx=tileToPlot(x,y);
  if(idx>=0){                                    // 农田：走过去干活
    const p=S.plots[idx];
    if(!p.unlocked){toast("这块地还没解锁，去商店买地～");return;}
    const tool=S.tool; goTo(x,y,()=>doTileAction(idx,tool)); return;
  }
  if(inBuilding(DINER,x,y)){goTo(DINER.doorX,DINER.doorY,()=>{dinerTab="orders";openDiner();});return;}
  if(inBuilding(SHOP,x,y)){goTo(SHOP.doorX,SHOP.doorY,()=>openShop());return;}
  for(let i=0;i<Math.min(S.customers.length,CUSTOMER_SPOTS.length);i++){const s=CUSTOMER_SPOTS[i];if(s[0]===x&&s[1]===y){goTo(DINER.doorX,DINER.doorY,()=>{dinerTab="orders";openDiner();});return;}}
  if(isWalkable(x,y))goTo(x,y,null);             // 空地：散步
}
function doTileAction(idx,tool){
  const p=S.plots[idx];
  if(tool==="hoe"){
    if(p.crop){toast("这里有作物，先收完吧");return;}
    p.tilled=!p.tilled; if(p.tilled){if(!useEnergy(1)){p.tilled=false;return;}toast("锄好地啦 🪓");}
  }else if(tool==="water"){
    if(!p.tilled||!p.crop){toast("先种点东西再浇水～");return;}
    if(p.ready){toast("已经熟啦，直接收获！");return;}
    if(p.watered){toast("已经浇过水咯 💧");return;}
    if(!useEnergy(1))return; p.watered=true;
  }else if(tool==="harvest"){
    if(p.crop&&p.ready)harvest(idx);
    else if(p.crop)toast("还没熟，再等等～");
    else toast("这里没有可收获的作物");
  }else if(tool==="plant"){
    if(!p.tilled){toast("先用锄头锄地 🪓");return;}
    if(p.crop){toast("这格已经种了东西");return;}
    plant(idx);
  }
  refresh();
}
function plant(idx){
  const sk=S.plantSeed;
  if(!sk||!(S.inv[sk+"_seed"]>0)){toast("没有这种种子，去商店买或换一种");openSeedPicker();return;}
  const c=CROPS[sk];
  if(c.season!==-1&&c.season!==S.season){toast(`${c.name}只能在${SEASONS[c.season]}季种哦`);return;}
  if(!useEnergy(1))return;
  S.inv[sk+"_seed"]--; if(S.inv[sk+"_seed"]<=0)delete S.inv[sk+"_seed"];
  const p=S.plots[idx]; p.crop=sk; p.growth=0; p.ready=false; p.watered=false;
  toast(`种下了${c.name} ${c.emoji}`); refreshToolbar();
}
function harvest(idx){
  const p=S.plots[idx],c=CROPS[p.crop];
  if(!useEnergy(1))return;
  S.inv[p.crop]=(S.inv[p.crop]||0)+1; sparkle(idx);
  if(c.regrow>0){p.ready=false; p.growth=c.grow-c.regrow; p.watered=false;}
  else {p.crop=null;p.growth=0;p.ready=false;p.watered=false;}
  toast(`收获 ${c.name} ${c.emoji} +1`);
}
function useEnergy(n){if(S.energy<n){toast("体力不够了，打烊睡一觉吧 😴");return false;}S.energy-=n;return true;}

let particles=[];
function sparkle(idx){
  const wx=FARM_X+idx%GRID_W, wy=FARM_Y+Math.floor(idx/GRID_W);
  const x=wx*TILE+TILE/2, y=wy*TILE+TILE/2;   // 世界像素坐标
  for(let k=0;k<8;k++)particles.push({x,y,vx:rnd(-2,2),vy:rnd(-3,-1),life:1});
}
function drawParticles(){ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`${Math.round(TILE*0.26)}px serif`;for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillText("✨",p.x-cam.x,p.y-cam.y);}ctx.globalAlpha=1;}
function stepParticles(){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.03;}particles=particles.filter(p=>p.life>0);}

// ---------- 打烊 ----------
function sleep(){
  const fd=document.getElementById("fade");
  document.getElementById("summary").innerHTML=
    `🌙 ${S.playerName}老板，今日打烊<br>招待客人 <b>${S.todayServed}</b> 位<br>进账 🪙<b>${S.todayEarn}</b><br><span style="font-size:13px;color:#8a6f57">退休的日子，不慌不忙～</span>`;
  fd.classList.add("on");
  setTimeout(()=>{nextDay();fd.classList.remove("on");},1400);
}
function nextDay(){
  for(const p of S.plots){
    if(p.crop&&!p.ready){if(p.watered)p.growth++; p.watered=false; if(p.growth>=CROPS[p.crop].grow)p.ready=true;}
    else if(p.crop&&p.ready)p.watered=false;
  }
  S.day++;
  if(S.day>SEASON_DAYS){
    S.day=1; S.season++;
    if(S.season>3){S.season=0;S.year++;}
    for(const p of S.plots){if(p.crop){const c=CROPS[p.crop];if(c.season!==-1&&c.season!==S.season){p.crop=null;p.growth=0;p.ready=false;p.watered=false;}}}
    toast(`${SEASON_EMOJI[S.season]} 进入${SEASONS[S.season]}季！非当季作物已枯萎`);
  }
  S.energy=S.maxEnergy; S.todayEarn=0; S.todayServed=0; S.customers=genCustomers();
  save(); refresh();
}

// ---------- 显示工具 ----------
function itemDisplay(key){
  if(key.endsWith("_seed")){const c=CROPS[key.replace("_seed","")];return{emoji:c.emoji,name:c.name+"种子"};}
  if(CROPS[key])return{emoji:CROPS[key].emoji,name:CROPS[key].name};
  if(PANTRY[key])return{emoji:PANTRY[key].emoji,name:PANTRY[key].name};
  return{emoji:"❔",name:key};
}
function recipeStr(id){const r=DISHES[id].recipe;let s=[];for(const k in r){const d=itemDisplay(k);s.push(`${d.emoji}×${r[k]}`);}return s.join("  ");}
function missingStr(id){const r=DISHES[id].recipe;let m=[];for(const k in r){const have=S.inv[k]||0;if(have<r[k]){const d=itemDisplay(k);m.push(`${d.emoji}缺${r[k]-have}`);}}return m.join(" ");}

const TOOLS=[{id:"hoe",em:"🪓",nm:"锄地"},{id:"plant",em:"🌱",nm:"种子"},{id:"water",em:"💧",nm:"浇水"},{id:"harvest",em:"🧺",nm:"收获"}];
function refreshToolbar(){
  const tb=document.getElementById("toolbar"); tb.innerHTML="";
  for(const t of TOOLS){
    const d=document.createElement("div");
    d.className="tool"+(S.tool===t.id?" sel":"");
    let label=t.nm; if(t.id==="plant"&&S.plantSeed)label=CROPS[S.plantSeed].name;
    d.innerHTML=`<div>${t.em}</div><div class="nm">${label}</div>`;
    d.onclick=()=>{if(t.id==="plant"){const owned=Object.keys(S.inv).filter(k=>k.endsWith("_seed"));if(!S.plantSeed||owned.length>1)openSeedPicker();}S.tool=t.id;refreshToolbar();};
    tb.appendChild(d);
  }
}
function refresh(){
  if(!S)return;
  document.getElementById("dateTxt").textContent=`${SEASONS[S.season]} · 第${S.day}天 (第${S.year}年)`;
  document.getElementById("dateChip").querySelector(".ic").textContent=SEASON_EMOJI[S.season];
  document.getElementById("goldTxt").textContent=S.gold.toLocaleString();
  document.getElementById("fameTxt").textContent=S.fame;
  document.getElementById("energyFill").style.width=Math.round(S.energy/S.maxEnergy*100)+"%";
  const badge=document.getElementById("dinerBadge"),wait=S.customers.length;
  if(wait>0){badge.style.display="flex";badge.textContent=wait;}else badge.style.display="none";
  const tk=document.getElementById("ticker");
  const needWater=S.plots.filter(p=>p.crop&&!p.ready&&!p.watered).length;
  const canHarvest=S.plots.filter(p=>p.crop&&p.ready).length;
  if(canHarvest>0) tk.innerHTML=`🧺 有 <b>${canHarvest}</b> 株作物熟啦，快收获！`;
  else if(needWater>0) tk.innerHTML=`💧 有 <b>${needWater}</b> 块地今天还没浇水`;
  else if(wait>0) tk.innerHTML=`🍽️ 有 <b>${wait}</b> 位客人在等位，去「🍳菜馆」招待`;
  else tk.innerHTML=`☕ 一切打理妥当，悠闲一下吧～`;
  draw();
}
function loop(){stepPlayer();stepParticles();draw();requestAnimationFrame(loop);}

let toastTimer=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),1600);}

const overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
function openPanel(title,body){
  panel.innerHTML=`<div class="ptitle"><span>${title}</span><button class="pclose">✕</button></div><div class="pbody">${body}</div>`;
  panel.querySelector(".pclose").onclick=closePanel; overlay.classList.add("on");
}
function closePanel(){overlay.classList.remove("on");}
overlay.addEventListener("click",e=>{if(e.target===overlay)closePanel();});
function reopenScroll(fn){const pb=panel.querySelector(".pbody");const st=pb?pb.scrollTop:0;fn();const pb2=panel.querySelector(".pbody");if(pb2)pb2.scrollTop=st;}

// 选种
function openSeedPicker(){
  const owned=Object.keys(S.inv).filter(k=>k.endsWith("_seed")&&S.inv[k]>0);
  let html=owned.length?"":`<div class="empty">背包里没有种子<br>去 🛒 商店买点吧～</div>`;
  for(const key of owned){
    const ck=key.replace("_seed",""),c=CROPS[ck],ok=(c.season===-1||c.season===S.season);
    html+=`<div class="row"><div class="icon">${c.emoji}</div>
      <div class="info"><div class="nm">${c.name}种子 ×${S.inv[key]}</div>
      <div class="sub">${ok?`本季可种 · 成长${c.grow}天`:`只能在${SEASONS[c.season]}季种`}</div></div>
      <div class="act"><button class="pill ${ok?'':'gray'}" data-pick="${ck}">${ok?'选它':'非当季'}</button></div></div>`;
  }
  openPanel("🌱 选择种子",html);
  panel.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const ck=b.dataset.pick,c=CROPS[ck];
    if(c.season!==-1&&c.season!==S.season){toast(`${c.name}只能在${SEASONS[c.season]}季种`);return;}
    S.plantSeed=ck;S.tool="plant";closePanel();refreshToolbar();toast(`已选 ${c.name}，点田地种下`);
  });
}

// 商店
function openShop(){
  let seeds="";
  for(const ck in CROPS){
    if(ck==="ancient")continue;
    const c=CROPS[ck],inSeason=(c.season===S.season);
    seeds+=shopRow(c.emoji,`${c.name}种子`,`${SEASONS[c.season]}季 · 成长${c.grow}天${c.regrow?' · 反复结果':''}`,c.seed,ck+"_seed",inSeason?"":"（非当季）",S.inv[ck+"_seed"]||0);
  }
  const a=CROPS.ancient;
  seeds+=shopRow(a.emoji,`${a.name}种子 ⭐`,`任意季节 · 成长${a.grow}天 · 招牌甜点用它`,a.seed,"ancient_seed","",S.inv["ancient_seed"]||0);
  let pantry="";
  for(const pk in PANTRY){const p=PANTRY[pk];pantry+=shopRow(p.emoji,p.name,`做料理的常用食材`,p.price,pk,"",S.inv[pk]||0);}
  const nextLand=S.plots.findIndex(p=>!p.unlocked);
  const landPrice=300+S.extraLandBought*200;
  let land=nextLand>=0?shopRow("🏞️","开垦新地","解锁一块新田地（越买越贵）",landPrice,"land","",null):`<div class="empty">所有土地都已开垦完毕 🎉</div>`;
  const html=`<div class="hint">💡 买回的食材 + 自己种的菜，就能在菜馆做料理招待客人</div>
    <div class="sectit">🌱 种子</div>${seeds}
    <div class="sectit">🧺 杂货食材</div>${pantry}
    <div class="sectit">🏞️ 扩建</div>${land}`;
  openPanel("🛒 商店",html); bindShop();
}
function shopRow(emoji,name,sub,price,buyId,dis,owned){
  const can=S.gold>=price&&!dis, can5=S.gold>=price*5&&!dis;
  const ownTxt=(owned!==null&&owned!==undefined)?` · 拥有 ×${owned}`:"";
  const five=(buyId==="land")?"":`<button class="pill buy sm ${can5?'':'gray'}" data-buy="${buyId}" data-price="${price}" data-qty="5">×5</button>`;
  return `<div class="row"><div class="icon">${emoji}</div>
    <div class="info"><div class="nm">${name}</div><div class="sub">${sub}${dis?`<span style="color:#c0394e">${dis}</span>`:''}${ownTxt}</div></div>
    <div class="act"><div class="actrow">
      <button class="pill buy sm ${can?'':'gray'}" data-buy="${buyId}" data-price="${price}" data-qty="1">🪙${price}</button>${five}
    </div></div></div>`;
}
function bindShop(){panel.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy,+b.dataset.price,+b.dataset.qty));}
function buy(id,price,qty){
  qty=qty||1;
  if(id==="land"){
    if(S.gold<price){toast("金币不够啦～");return;}
    const idx=S.plots.findIndex(p=>!p.unlocked); if(idx<0){toast("没有更多地了");return;}
    S.plots[idx].unlocked=true; S.extraLandBought++; S.gold-=price; toast("开垦了一块新地！🏞️");
  }else{
    const total=price*qty;
    if(S.gold<total){toast(qty>1?`金币不够买${qty}个`:"金币不够啦～");return;}
    if(id.endsWith("_seed")){
      const ck=id.replace("_seed","");
      if(ck!=="ancient"&&CROPS[ck].season!==S.season){toast("非当季种子，现在种不了哦");return;}
      S.gold-=total; S.inv[id]=(S.inv[id]||0)+qty; toast(`买了${qty}包${CROPS[ck].name}种子`);
    }else if(PANTRY[id]){S.gold-=total; S.inv[id]=(S.inv[id]||0)+qty; toast(`买了${qty}份${PANTRY[id].name}`);}
  }
  save(); refresh(); reopenScroll(openShop);
}

// 菜馆
let dinerTab="orders";
function openDiner(){
  const tabs=`<div class="tabs">
    <div class="tab ${dinerTab==='orders'?'on':''}" data-tab="orders">🍽️ 客人点单</div>
    <div class="tab ${dinerTab==='sell'?'on':''}" data-tab="sell">💰 卖余货</div></div>`;
  let body;
  if(dinerTab==="orders"){
    if(S.customers.length===0)body=`<div class="empty">客人都招待完啦 🎉<br>去种菜备货，或「🛏️打烊」迎接明天的客人～</div>`;
    else{
      body=`<div class="hint">招待不完也没关系——客人会自己回家，没有惩罚，慢慢来 ☕</div>`;
      S.customers.forEach((cust,i)=>{
        const dish=DISHES[cust.dish],ok=canCook(cust.dish);
        body+=`<div class="row"><div class="icon" style="font-size:30px">${cust.avatar}</div>
          <div class="info"><div class="nm">${cust.name||"小客人"} 想吃 ${dish.emoji}${dish.name}${cust.vip?'<span class="vip">VIP</span>':''}</div>
          <div class="sub">配方：${recipeStr(cust.dish)}<br>报酬 🪙${cust.pay}${ok?'':` · <span style="color:#c0394e">${missingStr(cust.dish)}</span>`}</div></div>
          <div class="act"><button class="pill ${ok?'':'gray'}" data-cook="${i}">${ok?'下厨 🍳':'缺食材'}</button></div></div>`;
      });
    }
  }else{
    const crops=Object.keys(S.inv).filter(k=>CROPS[k]&&S.inv[k]>0);
    if(crops.length===0)body=`<div class="empty">没有可卖的作物～<br>留着食材做料理更赚哦</div>`;
    else{
      body=`<div class="hint">散卖只值一点点，留着做料理招待客人更赚 💰</div>`;
      for(const ck of crops){const c=CROPS[ck];
        body+=`<div class="row"><div class="icon">${c.emoji}</div>
          <div class="info"><div class="nm">${c.name} ×${S.inv[ck]}</div><div class="sub">散卖 🪙${c.sell}/个</div></div>
          <div class="act"><div class="actrow"><button class="pill sm" data-sell1="${ck}">卖1</button><button class="pill sm red" data-sellall="${ck}">全卖</button></div></div></div>`;
      }
    }
  }
  openPanel("🍳 退休菜馆",tabs+body);
  panel.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{dinerTab=t.dataset.tab;openDiner();});
  panel.querySelectorAll("[data-cook]").forEach(b=>b.onclick=()=>cook(+b.dataset.cook));
  panel.querySelectorAll("[data-sell1]").forEach(b=>b.onclick=()=>sellCrop(b.dataset.sell1,1));
  panel.querySelectorAll("[data-sellall]").forEach(b=>b.onclick=()=>sellCrop(b.dataset.sellall,S.inv[b.dataset.sellall]));
}
function cook(i){
  const cust=S.customers[i]; if(!cust)return;
  if(!canCook(cust.dish)){toast("食材不够呢～");return;}
  const r=DISHES[cust.dish].recipe;
  for(const k in r){S.inv[k]-=r[k];if(S.inv[k]<=0)delete S.inv[k];}
  S.gold+=cust.pay;
  const fameGain=8+(cust.vip?14:0),before=S.fame; S.fame+=fameGain;
  S.todayEarn+=cust.pay; S.todayServed++; S.customers.splice(i,1);
  toast(`${cust.name||"客人"}很满意！${DISHES[cust.dish].emoji} +🪙${cust.pay} +⭐${fameGain}`);
  for(const id in DISHES){if(before<DISHES[id].fame&&S.fame>=DISHES[id].fame)setTimeout(()=>toast(`🎉 新菜谱解锁：${DISHES[id].emoji}${DISHES[id].name}`),700);}
  save();refresh();reopenScroll(openDiner);
}
function sellCrop(ck,n){
  n=Math.min(n,S.inv[ck]||0);if(n<=0)return;
  const gain=CROPS[ck].sell*n; S.inv[ck]-=n; if(S.inv[ck]<=0)delete S.inv[ck];
  S.gold+=gain; toast(`卖出 ${CROPS[ck].name}×${n}，+🪙${gain}`); save();refresh();reopenScroll(openDiner);
}

// 图鉴
function openBook(){
  const ids=Object.keys(DISHES),unlocked=ids.filter(id=>S.fame>=DISHES[id].fame);
  let html=`<div class="hint">已解锁 <b>${unlocked.length}/${ids.length}</b> 道料理 · 当前人气 ⭐${S.fame}<br>招待客人涨人气，人气越高，新菜越多</div>`;
  ids.sort((a,b)=>DISHES[a].fame-DISHES[b].fame);
  for(const id of ids){
    const d=DISHES[id],open=S.fame>=d.fame;
    html+=open?`<div class="row"><div class="icon">${d.emoji}</div>
        <div class="info"><div class="nm">${d.name} <span class="tag">售🪙${d.price}</span></div>
        <div class="sub">配方：${recipeStr(id)}</div></div></div>`
      :`<div class="row" style="opacity:.7"><div class="icon">❔</div>
        <div class="info"><div class="nm">？？？ <span class="tag lock">人气${d.fame}解锁</span></div>
        <div class="sub">提升人气后揭晓～</div></div></div>`;
  }
  openPanel("📖 料理图鉴",html);
}

// 背包
function openBag(){
  const keys=Object.keys(S.inv).filter(k=>S.inv[k]>0);
  let seeds="",crops="",pan="";
  for(const k of keys){
    if(k.endsWith("_seed")){const c=CROPS[k.replace("_seed","")];seeds+=bagRow(c.emoji,c.name+"种子",S.inv[k]);}
    else if(CROPS[k])crops+=bagRow(CROPS[k].emoji,CROPS[k].name,S.inv[k]);
    else if(PANTRY[k])pan+=bagRow(PANTRY[k].emoji,PANTRY[k].name,S.inv[k]);
  }
  let html="";
  if(seeds)html+=`<div class="sectit">🌱 种子</div>${seeds}`;
  if(crops)html+=`<div class="sectit">🧺 收获的菜</div>${crops}`;
  if(pan)html+=`<div class="sectit">🍳 杂货食材</div>${pan}`;
  if(!html)html=`<div class="empty">背包是空的～</div>`;
  openPanel("🎒 背包",html);
}
function bagRow(em,nm,q){return `<div class="row"><div class="icon">${em}</div><div class="info"><div class="nm">${nm}</div></div><div class="act"><div class="chip" style="border-width:2px;padding:4px 10px;">×${q}</div></div></div>`;}

// 按钮
document.getElementById("btnShop").onclick=openShop;
document.getElementById("btnDiner").onclick=()=>{dinerTab="orders";openDiner();};
document.getElementById("btnBook").onclick=openBook;
document.getElementById("btnBag").onclick=openBag;
document.getElementById("btnSleep").onclick=sleep;

// ---------- 启动流程 ----------
let started=false;
function initPlayer(){player.col=6; player.row=4; player.path=[]; player.moving=false; player.pending=null; player.walkT=0;}
function enterGame(){buildWorld();initPlayer();resize();refreshToolbar();refresh();if(!started){started=true;loop();}}

// 起名页：人物选择（画出会走路的小人）
let selectedChar=CHARACTERS[0].id;
let setupRAF=null;
function buildCharGrid(){
  const g=document.getElementById("charGrid"); g.innerHTML="";
  CHARACTERS.forEach(def=>{
    const b=document.createElement("div"); b.className="charBtn"+(def.id===selectedChar?" on":"");
    const cn=document.createElement("canvas"); cn.width=60; cn.height=70; cn.dataset.id=def.id;
    const lbl=document.createElement("div"); lbl.className="cn"; lbl.textContent=def.name;
    b.appendChild(cn); b.appendChild(lbl);
    b.onclick=()=>{selectedChar=def.id;buildCharGrid();};
    g.appendChild(b);
  });
  startSetupAnim();
}
function startSetupAnim(){
  if(setupRAF)return;
  function fr(){
    const setup=document.getElementById("setup");
    if(setup.style.display==="none"){cancelAnimationFrame(setupRAF);setupRAF=null;return;}
    const wt=(Date.now()-t0)/1000*7;
    document.querySelectorAll("#charGrid canvas").forEach(cn=>{
      const def=getDef(cn.dataset.id); DC=cn.getContext("2d");
      DC.clearRect(0,0,cn.width,cn.height);
      drawChar(cn.width/2, cn.height-6, cn.height-20, def, wt, true);
    });
    DC=ctx;
    setupRAF=requestAnimationFrame(fr);
  }
  setupRAF=requestAnimationFrame(fr);
}

document.getElementById("startBtn").onclick=()=>{
  if(hasSave()){
    const loaded=load(); S=loaded;
    if(!S.customers)S.customers=genCustomers();
    if(S.fame===undefined)S.fame=0;
    if(S.todayEarn===undefined){S.todayEarn=0;S.todayServed=0;}
    if(!S.playerName)S.playerName="老板";
    if(!S.playerChar)S.playerChar="farmer_f";
    S.customers.forEach(c=>{if(!c.name)c.name=pick(NAMES);});
    document.getElementById("intro").style.display="none";
    enterGame(); toast(`欢迎回来，${S.playerName}老板～`);
  }else{
    document.getElementById("intro").style.display="none";
    document.getElementById("setup").style.display="flex";
    selectedChar=CHARACTERS[0].id; buildCharGrid();
  }
};
document.getElementById("setupOk").onclick=()=>{
  const name=document.getElementById("nameInput").value;
  newGame(name,selectedChar);
  document.getElementById("setup").style.display="none";
  enterGame(); save(); toast(`菜馆开张啦，${S.playerName}老板！`);
};
document.getElementById("resetBtn").onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}toast("已清空存档，点上面重新开张");document.getElementById("startBtn").textContent="开始退休生活";};
window.addEventListener("load",()=>{if(hasSave())document.getElementById("startBtn").textContent="继续退休生活";});
</script>
